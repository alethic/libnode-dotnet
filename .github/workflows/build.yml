name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NODE_CONFIG: Release

jobs:

  # ---------------------------------------------------------------------------------------------
  # Build Node.js as a shared library, one job per RID, with Node's own build commands. Each OS
  # builds natively (Node cannot cross-compile across operating systems); win-arm64 is
  # cross-compiled from x64 via --dest-cpu. Each job uploads its binaries as an artifact named
  # after the RID.
  # ---------------------------------------------------------------------------------------------
  node:
    name: node ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest,  cpu: x64 }
          - { rid: win-arm64,   os: windows-latest,  cpu: arm64 }
          - { rid: linux-x64,   os: ubuntu-24.04,    cpu: x64 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, cpu: arm64 }
          - { rid: osx-arm64,   os: macos-15,        cpu: arm64 }
          - { rid: osx-x64,     os: macos-15-intel,  cpu: x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      # The build is cached per RID, keyed by the ext/node submodule commit: Node is rebuilt only when the
      # submodule moves, or when the key's suffix is bumped after changing the build steps below.
      - name: Node Submodule Commit
        id: node
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:ext/node)" >> "$GITHUB_OUTPUT"

      - name: Cache libnode Build
        uses: actions/cache@v4
        with:
          path: artifact
          key: libnode--${{ matrix.rid }}--${{ steps.node.outputs.sha }}-1

      - name: Check libnode Build Stamp
        id: libnode-build-stamp
        uses: andstor/file-existence-action@v3
        with:
          files: artifact/stamp

      # The compilers are needed on every run: node-dotnet is built even when Node comes from the cache.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y ninja-build clang-20 lld-20
          echo "CC=/usr/lib/llvm-20/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/lib/llvm-20/bin/clang++" >> "$GITHUB_ENV"

      - name: Toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20 ninja
          echo "CC=$(brew --prefix llvm@20)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm@20)/bin/clang++" >> "$GITHUB_ENV"

      - name: Toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.cpu == 'arm64' && 'amd64_arm64' || 'amd64' }}

      - name: Rust toolchain
        if: steps.libnode-build-stamp.outputs.files_exists != 'true'
        shell: bash
        run: |
          # win-arm64 cross-compiles Node's Rust crates; the runner only has the x64 target.
          if [ "${{ matrix.rid }}" = "win-arm64" ]; then rustup target add aarch64-pc-windows-msvc; fi
          rustup show

      - name: Build (Windows)
        if: steps.libnode-build-stamp.outputs.files_exists != 'true' && runner.os == 'Windows'
        shell: pwsh
        working-directory: ext/node
        env:
          LLVM_DIR: C:\Program Files\LLVM
        run: |
          $clangVersion = (& "$env:LLVM_DIR\bin\clang.exe" --version | Select-Object -First 1) -replace '.*?(\d+\.\d+\.\d+).*', '$1'
          # gyp cannot find VS 2017+ through the registry; point it at the developer prompt's VS (as vcbuild.bat does).
          $env:GYP_MSVS_VERSION = if ($env:VisualStudioVersion -like '18.*') { '2026' } else { '2022' }
          $env:GYP_MSVS_OVERRIDE_PATH = $env:VSINSTALLDIR
          python configure --shared --dest-cpu=${{ matrix.cpu }} --clang-cl=$clangVersion
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $platform = if ('${{ matrix.cpu }}' -eq 'arm64') { 'ARM64' } else { 'x64' }
          msbuild node.sln /m /nologo /clp:NoItemAndPropertyList`;Verbosity=minimal /p:Configuration=$env:NODE_CONFIG /p:Platform=$platform /p:LLVMInstallDir="$env:LLVM_DIR" /p:LLVMToolsVersion=$clangVersion
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ../../artifact | Out-Null
          Copy-Item out/$env:NODE_CONFIG/libnode.dll, out/$env:NODE_CONFIG/libnode.lib, config.gypi ../../artifact/
          New-Item -ItemType File -Force ../../artifact/stamp | Out-Null

      - name: Build (Linux / macOS)
        if: steps.libnode-build-stamp.outputs.files_exists != 'true' && runner.os != 'Windows'
        shell: bash
        working-directory: ext/node
        run: |
          ./configure --shared --ninja --dest-cpu=${{ matrix.cpu }}
          ninja -C out/$NODE_CONFIG
          mkdir -p ../../artifact
          # libnode.so.<abi> (Linux, under lib/) or libnode.<abi>.dylib (macOS), per install.py.
          find out/$NODE_CONFIG -maxdepth 2 \( -name 'libnode.so.*' -o -name 'libnode.*.dylib' \) ! -name '*.TOC' -exec cp {} ../../artifact/ \;
          cp config.gypi ../../artifact/
          # Strip the static symbol table; exported (dynamic) symbols stay. macOS: re-apply the ad-hoc signature.
          if [ "$RUNNER_OS" = "Linux" ]; then strip --strip-unneeded ../../artifact/libnode.so.*; fi
          if [ "$RUNNER_OS" = "macOS" ]; then strip -x ../../artifact/libnode.*.dylib && codesign --force --sign - ../../artifact/libnode.*.dylib; fi
          touch ../../artifact/stamp

      # node-dotnet, the C embedding shim, built against this RID's headers and libnode with the same compiler.
      - name: Headers
        shell: bash
        working-directory: ext/node
        env:
          MSYS_NO_PATHCONV: 1 # keep Git Bash on Windows from rewriting --prefix /
        run: python tools/install.py install --headers-only --root-dir . --config-gypi-path ../../artifact/config.gypi --dest-dir ../../out/libnode --prefix /

      - name: Build node-dotnet
        shell: bash
        run: |
          args=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DLIBNODE_INCLUDE_DIR=out/libnode/include -DLIBNODE_DIR=artifact)
          if [ "$RUNNER_OS" = "Windows" ]; then
            args+=("-DCMAKE_CXX_COMPILER=C:/Program Files/LLVM/bin/clang-cl.exe")
            if [ "${{ matrix.cpu }}" = "arm64" ]; then args+=(-DCMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc); fi
          fi
          cmake -S src/node-dotnet -B out/node-dotnet "${args[@]}"
          cmake --build out/node-dotnet
          find out/node-dotnet -maxdepth 1 \( -name node-dotnet.dll -o -name libnode-dotnet.so -o -name libnode-dotnet.dylib \) -exec cp {} artifact/ \;

      - run: ls -la artifact/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: artifact/
          if-no-files-found: error
          compression-level: 0

  # ---------------------------------------------------------------------------------------------
  # Download every RID's binaries into out/libnode/<rid>/ and dotnet build: each project packs its
  # files.
  # ---------------------------------------------------------------------------------------------
  pack:
    name: pack
    needs: node
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          path: out/libnode/

      - run: ls -laR out/libnode/

      - name: Build
        run: dotnet build -c Release -p:Version=$(python ext/node/tools/getnodeversion.py).${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: out/pkg/*.nupkg
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # Publish to the alethic GitHub Packages NuGet registry (main and tags only).
  # ---------------------------------------------------------------------------------------------
  publish:
    name: publish
    needs: pack
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: out/pkg/

      - uses: actions/setup-dotnet@v4

      - name: Push to GitHub Packages
        run: dotnet nuget push "out/pkg/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
